  <!-- Inline CSS Animations -->
  <style>
    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes rotateGear {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.45);
      }

      70% {
        box-shadow: 0 0 0 7px rgba(59, 130, 246, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(59, 130, 246, 0);
      }
    }

    @media (max-width: 800px) {

      main {
        padding: 25px 15px !important;
      }

      main section {
        flex-direction: column !important;
        padding: 35px 25px !important;
        gap: 20px !important;
        text-align: center !important;
      }

      main section > div:last-child {
        text-align: center !important;
      }

      main section > div:last-child p {
        margin-left: auto !important;
        margin-right: auto !important;
      }

      main section > div:last-child > div:nth-of-type(2) {
        margin-left: auto !important;
        margin-right: auto !important;
      }

      main section > div:last-child > div:nth-of-type(3) {
        justify-content: center !important;
      }

      main section > div:last-child > a {
        margin-top: 0 !important;
      }

      #illustrationBox {
        max-width: 330px !important;
      }
    }

    @media (max-width: 480px) {

      main section {
        border-radius: 22px !important;
        padding: 28px 18px !important;
      }

      h1 {
        font-size: 38px !important;
        letter-spacing: -1.5px !important;
      }

      main section > div:last-child p {
        font-size: 15px !important;
      }

      footer {
        position: static !important;
        padding: 0 0 15px 0 !important;
      }
    }
  </style>


  <!-- Inline JavaScript -->
  <script>

    // Current Year
    document.getElementById("year").textContent = new Date().getFullYear();


    // Animated Dots
    let dotCount = 1;

    setInterval(function () {

      dotCount++;

      if (dotCount > 3) {
        dotCount = 1;
      }

      document.getElementById("dots").textContent =
        ".".repeat(dotCount);

    }, 500);


    // Subtle Progress Animation
    let progress = 75;

    setInterval(function () {

      progress += 1;

      if (progress > 92) {
        progress = 75;
      }

      document.getElementById("progressBar").style.width =
        progress + "%";

      document.getElementById("progressText").textContent =
        progress + "%";

    }, 5000);


    // Small parallax effect for desktop
    const illustration = document.getElementById("illustrationBox");

    document.addEventListener("mousemove", function (event) {

      if (window.innerWidth <= 800) return;

      const x = (window.innerWidth / 2 - event.clientX) / 100;
      const y = (window.innerHeight / 2 - event.clientY) / 100;

      illustration.style.transform =
        "translate(" + x + "px, " + y + "px)";

    });

    document.addEventListener("mouseleave", function () {
      illustration.style.transform = "";
    });

  </script>
